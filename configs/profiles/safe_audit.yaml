# Safe-audit profile — passive checks only, no exploit payloads
# Inherits default.yaml and overrides specific values

network:
  ssl_verify: true
  timeout: 5

retry:
  total: 2
  backoff_factor: 0.2
  pool_connections: 6
  pool_maxsize: 12

stealth:
  delay_enabled: true
  delay_probability: 0.5
  delay_min: 0.2
  delay_max: 1.0

logging:
  level: INFO
  verbose_errors: false
